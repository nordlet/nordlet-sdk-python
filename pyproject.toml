[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nordlet"
version = "0.2.6"
description = "Official Python SDK for the Nordlet Accounting API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.21.2",
    "pydantic>=1.9.2",
    "pydantic-core>=2.18.2",
    "typing_extensions>=4.0.0",
    "anyio>=3.5.0",
]

[project.optional-dependencies]
aiohttp = ["httpx-aiohttp>=0.1.8"]

[project.urls]
Repository = "https://github.com/nordlet/nordlet-sdk-python"
Documentation = "https://docs.nordlet.com"

[tool.hatch.build.targets.wheel]
packages = ["src/nordlet"]
